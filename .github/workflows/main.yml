name: Build FootballCareer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Projekt entpacken
        run: |
          mkdir extracted
          unzip -q FootballCareer_APK_Ready.zip -d extracted

      - name: APK bauen
        working-directory: extracted/FootballCareer_BuildReady/FootballCareer_RealGame
        run: gradle assembleDebug --no-daemon

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FootballCareer-APK
          path: extracted/FootballCareer_BuildReady/FootballCareer_RealGame/app/build/outputs/apk/debug/app-debug.apk
